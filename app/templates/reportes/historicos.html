{% extends "base.html" %}
{% block title %}Reportes Históricos - SADES{% endblock %}

{% block styles %}
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
<style>
    .ts-wrapper.form-select-lg .ts-control {
        background-color: #f8f9fa !important;
        border: none !important;
        border-radius: 12px !important;
        padding: 0.75rem 1rem !important;
        font-weight: 700 !important;
        min-height: 48px !important;
    }
    .ts-dropdown { border-radius: 12px !important; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1) !important; z-index: 1050 !important; }
    .bg-navy { background-color: #0f172a !important; }
    .nav-tabs .nav-link {
        border-radius: 10px 10px 0 0;
        font-weight: 600;
        color: #475569;
        border: 1px solid transparent;
    }
    .nav-tabs .nav-link.active {
        color: #0ea5e9;
        background-color: transparent;
        border-bottom: 3px solid #0ea5e9;
    }
    .btn-outline-primary { color: #06b6d4; border-color: #06b6d4; }
    .btn-outline-primary:hover { background-color: rgba(6, 182, 212, 0.1); color: #0891b2; border-color: #06b6d4; transform: translateY(-2px); }
    .btn-danger { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
    .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3) !important; }
</style>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-10 mx-auto">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-primary-color m-0"><i class="fas fa-archive me-2 text-primary"></i>Reportes Históricos</h2>
                <p class="text-muted mb-0">Consulta información de semestres anteriores</p>
            </div>
            <a href="{{ url_for('reportes.index') }}" class="btn btn-outline-secondary border-2 fw-bold">
                <i class="fas fa-arrow-left me-1"></i> Volver
            </a>
        </div>

        <div class="card border-0 shadow-sm overflow-hidden mb-4">
            <div class="card-header bg-navy text-white py-3 border-0">
                <h5 class="fw-bold m-0 small text-uppercase"><i class="fas fa-calendar-alt me-2 text-warning"></i>1. Selecciona un Ciclo Histórico</h5>
            </div>
            <div class="card-body p-4">
                <div class="form-group">
                    <label class="form-label fw-bold text-muted text-uppercase small">Ciclo Académico</label>
                    <select class="form-select form-select-lg bg-light border-0" id="ciclo_selector">
                        <option value="">-- Selecciona un ciclo --</option>
                        {% for ciclo in ciclos %}
                            <option value="{{ ciclo.id }}" data-codigo="{{ ciclo.codigo_ciclo }}">
                                {{ ciclo.nombre }} ({{ ciclo.codigo_ciclo }}) 
                                {% if ciclo.activo %}[ACTUAL]{% endif %}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <!-- Área de reportes, oculta hasta seleccionar un ciclo -->
        <div id="reportes_area" class="card border-0 shadow-sm overflow-hidden d-none">
            <div class="card-header bg-white border-bottom p-0">
                <ul class="nav nav-tabs px-4 pt-3 border-0" id="historicoTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active pb-3" id="general-tab" data-bs-toggle="tab" data-bs-target="#general" type="button" role="tab" aria-controls="general" aria-selected="true">
                            <i class="fas fa-users me-2"></i>Reporte General
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link pb-3" id="individual-tab" data-bs-toggle="tab" data-bs-target="#individual" type="button" role="tab" aria-controls="individual" aria-selected="false">
                            <i class="fas fa-user me-2"></i>Reporte Individual
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link pb-3" id="asistencia-tab" data-bs-toggle="tab" data-bs-target="#asistencia" type="button" role="tab" aria-controls="asistencia" aria-selected="false">
                            <i class="fas fa-calendar-check me-2"></i>Asistencia Grupal
                        </button>
                    </li>
                </ul>
            </div>

            <div class="card-body p-4 p-md-5">
                <div class="tab-content" id="historicoTabsContent">
                    
                    <!-- REPORTE GENERAL -->
                    <div class="tab-pane fade show active" id="general" role="tabpanel" aria-labelledby="general-tab">
                        <form id="formGeneral" method="POST" action="{{ url_for('reportes.generar_general') }}">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <input type="hidden" name="formato" id="formatoGeneral" value="html">
                            <input type="hidden" name="semestre" class="semestre_hidden_input">
                            
                            <div class="row g-4">
                                <div class="col-md-12">
                                    <div class="form-group mb-3">
                                        <label class="form-label small fw-bold text-muted text-uppercase">Filtrar por Categoría</label>
                                        <select class="form-select form-select-lg bg-light border-0" name="categoria" id="categoriaGeneral">
                                            <option value="TODOS">Todas las Alertas</option>
                                            <option value="SIN_RIESGO">Sin Riesgo Detectado</option>
                                            <option value="ALERTA_AMARILLA">Alerta Amarilla (Preventiva)</option>
                                            <option value="ALERTA_ROJA">Alerta Roja (Crítica)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row g-3 mt-4 border-top pt-4">
                                <div class="col-md-6">
                                    <button type="button" onclick="submitHistorico('formGeneral', 'html')" class="btn btn-outline-primary w-100 py-3 border-2 fw-bold shadow-sm">
                                        <i class="fas fa-desktop mb-2 d-block fa-lg"></i> Vista Previa HTML
                                    </button>
                                </div>
                                <div class="col-md-6">
                                    <button type="button" onclick="submitHistorico('formGeneral', 'pdf')" class="btn btn-danger w-100 py-3 border-0 fw-bold shadow-sm">
                                        <i class="fas fa-file-pdf mb-2 d-block fa-lg"></i> Generar PDF
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- REPORTE INDIVIDUAL -->
                    <div class="tab-pane fade" id="individual" role="tabpanel" aria-labelledby="individual-tab">
                        <form id="formIndividual" method="POST" action="{{ url_for('reportes.generar_individual') }}">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <input type="hidden" name="formato" id="formatoIndividual" value="html">
                            <input type="hidden" name="semestre" class="semestre_hidden_input">
                            
                            <div class="row g-4">
                                <div class="col-md-12">
                                    <div class="form-group mb-3">
                                        <label class="form-label small fw-bold text-muted text-uppercase">Seleccionar Estudiante</label>
                                        <select class="form-select form-select-lg bg-light border-0" name="estudiante_id" id="estudianteSelector" required>
                                            <option value="">-- Selecciona primero el ciclo arriba --</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row g-3 mt-4 border-top pt-4">
                                <div class="col-md-6">
                                    <button type="button" onclick="submitHistorico('formIndividual', 'html')" class="btn btn-outline-primary w-100 py-3 border-2 fw-bold shadow-sm">
                                        <i class="fas fa-desktop mb-2 d-block fa-lg"></i> Vista Previa HTML
                                    </button>
                                </div>
                                <div class="col-md-6">
                                    <button type="button" onclick="submitHistorico('formIndividual', 'pdf')" class="btn btn-danger w-100 py-3 border-0 fw-bold shadow-sm">
                                        <i class="fas fa-file-pdf mb-2 d-block fa-lg"></i> Generar PDF
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- REPORTE ASISTENCIAS -->
                    <div class="tab-pane fade" id="asistencia" role="tabpanel" aria-labelledby="asistencia-tab">
                        <form id="formAsistencia" method="POST" action="{{ url_for('reportes.generar_asistencia_grupal') }}">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <input type="hidden" name="formato" id="formatoAsistencia" value="html">
                            
                            <div class="row g-4">
                                <div class="col-md-12">
                                    <div class="form-group mb-3">
                                        <label class="form-label small fw-bold text-muted text-uppercase">Seleccionar Curso</label>
                                        <select class="form-select form-select-lg bg-light border-0" name="curso_id" id="cursoSelector" required>
                                            <option value="">-- Selecciona primero el ciclo arriba --</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row g-3 mt-4 border-top pt-4">
                                <div class="col-md-6">
                                    <button type="button" onclick="submitHistorico('formAsistencia', 'html')" class="btn btn-outline-primary w-100 py-3 border-2 fw-bold shadow-sm">
                                        <i class="fas fa-desktop mb-2 d-block fa-lg"></i> Vista Previa HTML
                                    </button>
                                </div>
                                <div class="col-md-6">
                                    <button type="button" onclick="submitHistorico('formAsistencia', 'pdf')" class="btn btn-danger w-100 py-3 border-0 fw-bold shadow-sm">
                                        <i class="fas fa-file-pdf mb-2 d-block fa-lg"></i> Generar PDF
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
<script>
    let selectCiclo, selectEstudiante, selectCurso, selectCategoria;

    document.addEventListener('DOMContentLoaded', function() {
        // Inicializar TomSelects
        selectCiclo = new TomSelect('#ciclo_selector', { 
            create: false, 
            placeholder: '-- Selecciona un ciclo --' 
        });
        selectCategoria = new TomSelect('#categoriaGeneral', { create: false });
        
        selectEstudiante = new TomSelect('#estudianteSelector', { 
            create: false, 
            valueField: 'id',
            labelField: 'text',
            searchField: 'text',
            placeholder: '-- Selecciona un estudiante --' 
        });
        
        selectCurso = new TomSelect('#cursoSelector', { 
            create: false, 
            valueField: 'id',
            labelField: 'text',
            searchField: 'text',
            placeholder: '-- Selecciona un curso --' 
        });

        // Evento de cambio de ciclo
        selectCiclo.on('change', function(ciclo_id) {
            if (!ciclo_id) {
                document.getElementById('reportes_area').classList.add('d-none');
                return;
            }
            
            const codigo_ciclo = selectCiclo.options[ciclo_id].dataset.codigo;
            
            // Actualizar campos ocultos de semestre
            document.querySelectorAll('.semestre_hidden_input').forEach(el => el.value = codigo_ciclo);
            
            // Mostrar área de reportes
            document.getElementById('reportes_area').classList.remove('d-none');
            
            // Cargar estudiantes y cursos vía API
            cargarDatosCiclo(ciclo_id);
        });
    });

    async function cargarDatosCiclo(ciclo_id) {
        try {
            // Deshabilitar selects mientras carga
            selectEstudiante.disable();
            selectCurso.disable();
            selectEstudiante.clearOptions();
            selectCurso.clearOptions();

            // Fetch estudiantes
            const resEst = await fetch(`/reportes/api/ciclos/${ciclo_id}/estudiantes`);
            if(resEst.ok) {
                const estudiantes = await resEst.json();
                estudiantes.forEach(e => {
                    selectEstudiante.addOption({
                        id: e.id,
                        text: `${e.apellidos}, ${e.nombres} (${e.codigo})`
                    });
                });
            }

            // Fetch cursos
            const resCur = await fetch(`/reportes/api/ciclos/${ciclo_id}/cursos`);
            if(resCur.ok) {
                const cursos = await resCur.json();
                cursos.forEach(c => {
                    selectCurso.addOption({
                        id: c.id,
                        text: `${c.nombre} (${c.codigo})`
                    });
                });
            }

            // Habilitar selects
            selectEstudiante.enable();
            selectCurso.enable();

        } catch (error) {
            console.error("Error al cargar datos del ciclo:", error);
            Swal.fire('Error', 'No se pudieron cargar los datos del ciclo', 'error');
        }
    }

    function submitHistorico(formId, formato) {
        const form = document.getElementById(formId);
        
        // Asignar el formato correcto al input oculto
        if (formId === 'formGeneral') {
            document.getElementById('formatoGeneral').value = formato;
        } else if (formId === 'formIndividual') {
            document.getElementById('formatoIndividual').value = formato;
        } else if (formId === 'formAsistencia') {
            document.getElementById('formatoAsistencia').value = formato;
        }

        if (form.checkValidity()) {
            form.submit();
        } else {
            form.reportValidity();
        }
    }
</script>
{% endblock %}
